<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#276749">
  <title>水果推荐</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --ink: #172116;
      --muted: #64715f;
      --line: #dce5d6;
      --leaf: #276749;
      --leaf-soft: #e8f3e2;
      --gold-soft: #fff3d7;
      --bg: #f6f8f2;
      --card: #ffffff;
      --fruit-main: #276749;
      --fruit-soft: #e8f3e2;
      --fruit-line: #c6dac0;
      --fruit-ink: #17321f;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(100%, 820px);
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 28px;
      background: var(--bg);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 16px 14px 12px;
      background: var(--leaf);
      color: #fff;
      box-shadow: 0 8px 20px rgba(24, 65, 42, 0.20);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: 0;
    }

    .import-button {
      flex: 0 0 auto;
      min-height: 36px;
      border: 0;
      border-radius: 8px;
      padding: 0 12px;
      color: #17321f;
      background: #fff;
      font-weight: 800;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .search-wrap {
      grid-column: 1 / -1;
    }

    select,
    input {
      width: 100%;
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      padding: 0 12px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    input::placeholder {
      color: #8a9687;
    }

    main {
      padding: 16px 12px 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .stat {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: 0 4px 12px rgba(34, 59, 37, 0.05);
    }

    .stat span {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .stat strong {
      display: block;
      overflow: hidden;
      color: var(--ink);
      font-size: 17px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chip-rail {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: max-content;
      gap: 7px;
      overflow-x: auto;
      margin: 0 -12px 10px;
      padding: 0 12px 2px;
      scrollbar-width: none;
    }

    .chip-rail::-webkit-scrollbar {
      display: none;
    }

    .chip {
      min-width: 46px;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      color: #344331;
      background: #fff;
      font-weight: 750;
      white-space: nowrap;
    }

    .chip.active {
      border-color: #a16010;
      color: #633700;
      background: var(--gold-soft);
    }

    .result-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 4px 2px 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .data-status {
      flex: 0 0 auto;
      min-height: 24px;
      padding: 4px 8px;
      border: 1px solid #c8d9bf;
      border-radius: 999px;
      color: #315438;
      background: #eef7e9;
      font-size: 12px;
      font-weight: 750;
      line-height: 1.2;
    }

    .data-status.warn {
      border-color: #e2c98d;
      color: #6b4708;
      background: #fff4d5;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .item {
      width: 100%;
      min-height: 138px;
      border: 1px solid var(--fruit-line);
      border-radius: 8px;
      padding: 12px;
      background: linear-gradient(90deg, var(--fruit-soft) 0 7px, var(--card) 7px 100%);
      color: inherit;
      text-align: left;
      box-shadow: 0 5px 16px rgba(34, 59, 37, 0.06);
    }

    .item:active {
      transform: translateY(1px);
    }

    .row-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      margin-bottom: 10px;
    }

    .fruit {
      display: inline-block;
      max-width: 100%;
      margin-bottom: 4px;
      padding: 3px 7px;
      border-radius: 999px;
      color: var(--fruit-main);
      background: var(--fruit-soft);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .variety {
      margin: 0;
      color: var(--fruit-ink);
      font-size: 19px;
      line-height: 1.25;
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .platform {
      min-width: 58px;
      max-width: 116px;
      min-height: 28px;
      padding: 5px 8px;
      border: 1px solid var(--fruit-line);
      border-radius: 8px;
      color: var(--fruit-ink);
      background: var(--fruit-soft);
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .meta {
      display: grid;
      grid-template-columns: 1.25fr 0.85fr;
      gap: 8px;
      font-size: 13px;
      line-height: 1.35;
    }

    .meta div {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .meta span {
      display: block;
      margin-bottom: 2px;
      color: var(--fruit-main);
      font-size: 11px;
      line-height: 1.2;
    }

    .empty {
      display: none;
      margin-top: 28px;
      padding: 22px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #fff;
      text-align: center;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: flex-end;
      background: rgba(13, 24, 16, 0.46);
    }

    .modal-mask.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-height: 86vh;
      overflow: auto;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
      border-top: 7px solid var(--fruit-main);
      border-radius: 8px 8px 0 0;
      background: #fff;
      box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.20);
    }

    .modal-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 38px;
      gap: 10px;
      align-items: start;
      margin-bottom: 14px;
    }

    .modal-title {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .modal-subtitle {
      margin: 0;
      color: var(--fruit-main);
      font-size: 14px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      color: var(--fruit-ink);
      background: var(--fruit-soft);
      font-size: 24px;
      line-height: 1;
    }

    .detail-grid {
      display: grid;
      gap: 9px;
    }

    .store-detail {
      padding: 10px;
      border: 1px solid var(--fruit-line);
      border-radius: 8px;
      background: var(--fruit-soft);
    }

    .store-detail h3 {
      margin: 0 0 8px;
      color: var(--fruit-ink);
      font-size: 16px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .store-detail .detail-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      font-size: 13px;
      line-height: 1.35;
    }

    .detail-meta span {
      display: block;
      color: var(--fruit-main);
      font-size: 11px;
      margin-bottom: 2px;
    }

    .detail-meta div {
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .import-modal {
      border-top-color: var(--leaf);
    }

    .import-form {
      display: grid;
      gap: 10px;
    }

    .form-field {
      display: grid;
      gap: 5px;
    }

    .form-field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .form-field input {
      border: 1px solid var(--line);
      background: #fff;
    }

    .import-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .primary-action,
    .secondary-action {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      font-weight: 800;
    }

    .primary-action {
      color: #fff;
      background: var(--leaf);
    }

    .secondary-action {
      color: #213520;
      background: #edf2e8;
    }

    .import-status {
      min-height: 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .import-status.error {
      color: #9f2d20;
    }

    .app {
      width: min(100%, 920px);
      background:
        linear-gradient(180deg, #f7faf1 0%, #f2f7ec 42%, #fff7ef 100%);
    }

    header {
      overflow: hidden;
      padding: 18px 14px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      background:
        linear-gradient(135deg, #163d2a 0%, #2b6748 56%, #cb7d1b 100%);
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.10) 0 1px, transparent 1px 18px);
      opacity: 0.45;
    }

    .header-top,
    .filters {
      position: relative;
      z-index: 1;
    }

    .header-top {
      align-items: stretch;
      gap: 14px;
      margin-bottom: 14px;
    }

    .header-copy {
      min-width: 0;
    }

    .eyebrow {
      display: block;
      margin-bottom: 4px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      line-height: 1.2;
      font-weight: 800;
    }

    h1 {
      font-size: 26px;
      line-height: 1.15;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(68px, auto));
      gap: 8px;
      align-items: stretch;
    }

    .toolbar-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 8px;
      padding: 0 11px;
      color: #14331f;
      background: rgba(255, 255, 255, 0.92);
      font-size: 13px;
      font-weight: 850;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(13, 33, 20, 0.16);
    }

    .toolbar-button:active {
      transform: translateY(1px);
    }

    .toolbar-button .button-icon {
      display: inline-grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      color: #fff;
      background: #2b6748;
      font-size: 13px;
      line-height: 1;
    }

    .download-button .button-icon {
      background: #b36110;
    }

    .filters {
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    select,
    input {
      border: 1px solid rgba(33, 75, 48, 0.10);
      box-shadow: 0 4px 12px rgba(10, 31, 18, 0.08);
    }

    main {
      padding: 16px 12px 0;
    }

    .stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-bottom: 14px;
    }

    .stat {
      position: relative;
      overflow: hidden;
      min-height: 70px;
      padding: 11px 12px;
      border-color: rgba(83, 111, 75, 0.18);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 9px 22px rgba(35, 61, 33, 0.08);
    }

    .stat::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: linear-gradient(90deg, #2b6748, #d18a28, #b94d45);
    }

    .stat span {
      margin-bottom: 6px;
      color: #63715e;
      font-size: 12px;
    }

    .stat strong {
      color: #182417;
      font-size: 22px;
      font-weight: 850;
    }

    .stat:nth-child(5) {
      grid-column: 1 / -1;
    }

    .chip-rail {
      margin-bottom: 11px;
      padding-bottom: 4px;
    }

    .chip {
      min-height: 36px;
      border-color: rgba(89, 111, 79, 0.24);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 5px 14px rgba(37, 59, 33, 0.06);
    }

    .chip.active {
      border-color: #c27820;
      color: #fff;
      background: #b86618;
      box-shadow: 0 8px 18px rgba(178, 99, 24, 0.20);
    }

    .result-line {
      align-items: stretch;
      margin: 6px 0 12px;
      padding: 10px 11px;
      border: 1px solid rgba(91, 114, 80, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 6px 18px rgba(35, 61, 33, 0.06);
    }

    .result-line > span {
      display: inline-flex;
      align-items: center;
    }

    .data-status,
    .download-status {
      border-radius: 8px;
    }

    .download-status {
      min-height: 24px;
      padding: 4px 8px;
      color: #704108;
      background: #fff0d7;
      font-size: 12px;
      font-weight: 750;
      line-height: 1.2;
    }

    .download-status.error {
      color: #9f2d20;
      background: #ffe6df;
    }

    .list {
      gap: 12px;
    }

    .item {
      position: relative;
      overflow: hidden;
      min-height: 154px;
      padding: 13px;
      background:
        linear-gradient(90deg, var(--fruit-main) 0 5px, transparent 5px 100%),
        linear-gradient(180deg, var(--fruit-soft), #fff 76%);
      box-shadow: 0 10px 24px rgba(34, 59, 37, 0.10);
      transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
    }

    .item:hover {
      border-color: var(--fruit-main);
      box-shadow: 0 14px 28px rgba(34, 59, 37, 0.13);
      transform: translateY(-1px);
    }

    .fruit {
      border: 1px solid var(--fruit-line);
    }

    .platform {
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
    }

    .meta {
      gap: 9px;
    }

    .meta div {
      padding: 8px;
      border: 1px solid rgba(84, 103, 75, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.62);
    }

    .modal {
      border-top-width: 6px;
      box-shadow: 0 -16px 40px rgba(0, 0, 0, 0.24);
    }

    .store-detail {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), var(--fruit-soft));
    }

    @media (max-width: 719px) {
      .stats {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 0;
        margin-bottom: 10px;
        padding: 8px 0;
        border: 1px solid rgba(83, 111, 75, 0.16);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
      }

      .stat,
      .stat:nth-child(5) {
        grid-column: auto;
        min-height: 0;
        padding: 0 4px;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        overflow: visible;
        text-align: center;
      }

      .stat + .stat {
        border-left: 1px solid rgba(83, 111, 75, 0.16);
      }

      .stat::after {
        display: none;
      }

      .stat span {
        margin-bottom: 3px;
        font-size: 0.875rem;
        line-height: 1.3;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .stat strong {
        font-size: 1.125rem;
        line-height: 1.25;
        font-variant-numeric: tabular-nums;
        white-space: normal;
        overflow-wrap: anywhere;
        overflow: visible;
        text-overflow: clip;
      }

      .stat:nth-child(3) strong {
        color: #276749;
      }
    }

    @media (min-width: 720px) {
      header {
        border-radius: 0 0 8px 8px;
      }

      .filters {
        grid-template-columns: 1fr 1fr 1.2fr;
      }

      .search-wrap {
        grid-column: auto;
      }

      .list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stats {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .stat:nth-child(5) {
        grid-column: auto;
      }

      .modal-mask {
        align-items: center;
        justify-content: center;
        padding: 22px;
      }

      .modal {
        max-width: 600px;
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="header-top">
        <div class="header-copy">
          <span class="eyebrow">鲜果清单</span>
          <h1>水果推荐</h1>
        </div>
        <div class="actions" aria-label="页面操作">
          <button id="downloadData" class="toolbar-button download-button" type="button" title="下载当前结果" aria-label="下载当前结果">
            <span class="button-icon" aria-hidden="true">↓</span>
            <span>下载</span>
          </button>
          <button id="openImport" class="toolbar-button import-button" type="button" title="导入Excel" aria-label="导入Excel">
            <span class="button-icon" aria-hidden="true">+</span>
            <span>导入</span>
          </button>
        </div>
      </div>
      <div class="filters">
        <select id="fruitFilter" aria-label="水果大类"></select>
        <select id="countFilter" aria-label="购买次数" title="按每条店铺记录的购买次数筛选"></select>
        <div class="search-wrap">
          <input id="searchInput" type="search" placeholder="搜索水果、品种、店铺、价格" autocomplete="off">
        </div>
      </div>
    </header>

    <main>
      <section class="stats" aria-label="数据概览">
        <div class="stat"><span>水果卡片</span><strong id="totalCount">0</strong></div>
        <div class="stat"><span>店铺记录</span><strong id="storeCount">0</strong></div>
        <div class="stat"><span>当前结果</span><strong id="visibleCount">0</strong></div>
        <div class="stat"><span>浏览量</span><strong id="viewCount">0</strong></div>
        <div class="stat"><span>下载量</span><strong id="downloadCount">0</strong></div>
      </section>

      <div id="monthRail" class="chip-rail" aria-label="月份快捷筛选"></div>
      <div id="platformRail" class="chip-rail" aria-label="平台快捷筛选"></div>

      <div class="result-line">
        <span id="resultText">共 0 类</span>
        <span id="dataStatus" class="data-status warn">内置数据</span>
        <span id="downloadStatus" class="download-status">未下载</span>
        <span id="activeText">全部水果 · 全部月份 · 全部平台</span>
      </div>

      <div id="list" class="list"></div>
      <div id="empty" class="empty">没有找到符合条件的水果。</div>
    </main>
  </div>

  <div id="detailMask" class="modal-mask" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <section class="modal">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle" class="modal-title"></h2>
          <p id="modalSubtitle" class="modal-subtitle"></p>
        </div>
        <button id="closeDetail" class="icon-button" type="button" aria-label="关闭">×</button>
      </div>
      <div id="detailGrid" class="detail-grid"></div>
    </section>
  </div>

  <div id="importMask" class="modal-mask" role="dialog" aria-modal="true" aria-labelledby="importTitle">
    <section class="modal import-modal">
      <div class="modal-head">
        <div>
          <h2 id="importTitle" class="modal-title">导入表格</h2>
          <p id="importSubtitle" class="modal-subtitle">管理员登录后同步更新所有设备</p>
        </div>
        <button id="closeImport" class="icon-button" type="button" aria-label="关闭">×</button>
      </div>
      <div class="import-form">
        <div id="cloudEmailField" class="form-field" hidden>
          <label for="emailInput">管理员邮箱</label>
          <input id="emailInput" type="email" autocomplete="username" inputmode="email">
        </div>
        <div class="form-field">
          <label for="passwordInput">管理员密码</label>
          <input id="passwordInput" type="password" autocomplete="current-password">
        </div>
        <div class="form-field">

    }

    function normalizePlatform(value) {
      const text = dash(value).replace(/\?/g, "？").toUpperCase();
      if (text.includes("PDD")) return "PDD";
      if (text.includes("JD")) return "JD";
      if (text.includes("TB") || text.includes("天猫")) return "TB";
      if (text.includes("DY") || text.includes("抖音")) return "DY";
      return "未标注";
    }

    function parseCount(value) {
      const match = String(value ?? "").trim().match(/^(\d+)\s*(?:次)?$/);
      return match ? Number(match[1]) : 0;
    }

    const fruitCategories = [
      { label: "橘子 / 柑（含沃柑）", names: ["橘子", "柑", "沃柑"] },
      { label: "甜瓜（含哈密瓜）", names: ["甜瓜", "哈密瓜"] },
      { label: "樱桃", names: ["樱桃", "大樱桃"] },
      { label: "番石榴（芭乐）", names: ["番石榴", "芭乐"] },
      { label: "姑娘果（灯笼果）", names: ["姑娘果", "灯笼果"] }
    ];
    const vegetableNames = new Set(["红薯", "白薯", "南瓜", "玉米", "芋头"]);

    function categoryFor(fruit) {
      return fruitCategories.find(category => category.names.includes(fruit))?.label || fruit;
    }

    function countLabel(value) {
      return value === "全部" ? "全部购买次数" : `购买 ${value} 次及以上`;
    }

    function monthLabel(value) {
      if (value === "全部") return "全部月份";
      if (value === "全年") return "全年可买";
      return `${value}月`;
    }

    function monthsText(value) {
      const text = dash(value);
      if (text === "全年") return "全年";
      const months = text.split(",").filter(month => /^\d+$/.test(month));
      return months.length ? months.map(month => `${month}月`).join("、") : "未收录";
    }

    function itemInMonth(item, month) {
      if (month === "全部") return true;
      if (item.mature_months === "全年") return true;
      if (month === "全年") return item.mature_months === "全年";
      return String(item.mature_months || "").split(",").includes(month);
    }

    function themeFor(fruit) {
      return fruitThemes[fruit] || fallbackTheme;
    }

    function applyFruitTheme(element, fruit) {
      const [main, soft, line, ink] = themeFor(fruit);
      element.style.setProperty("--fruit-main", main);
      element.style.setProperty("--fruit-soft", soft);
      element.style.setProperty("--fruit-line", line);
      element.style.setProperty("--fruit-ink", ink);
    }

    function loadStoredRows() {
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed.rows) ? parsed.rows : null;
      } catch {
        return null;
      }
    }

    function loadUsageMetrics() {
      try {
        const raw = localStorage.getItem(metricsKey);
        const parsed = raw ? JSON.parse(raw) : {};
        return {
          views: Number(parsed.views || 0),
          downloads: Number(parsed.downloads || 0)
        };
      } catch {
        return { views: 0, downloads: 0 };
      }
    }

    function saveUsageMetrics() {
      try {
        localStorage.setItem(metricsKey, JSON.stringify(usageMetrics));
      } catch {}
    }

    function recordPageView() {
      usageMetrics.views += 1;
      saveUsageMetrics();
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("zh-CN");
    }

    function renderUsageMetrics() {
      document.getElementById("viewCount").textContent = formatNumber(usageMetrics.views);
      document.getElementById("downloadCount").textContent = formatNumber(usageMetrics.downloads);
    }

    function setDownloadStatus(text, isError = false) {
      downloadStatus.textContent = text;
      downloadStatus.classList.toggle("error", isError);
    }

    function setDataStatus(text, isWarning = false) {
      dataStatus.textContent = text;
      dataStatus.classList.toggle("warn", isWarning);
    }

    function normalizeRecord(item) {
      return {
        fruit: dash(item.fruit),
        variety: dash(item.variety),
        store: dash(item.store),
        count: dash(item.count),
        price: dash(item.price),
        platform: normalizePlatform(item.platform),
        mature_months: dash(item.mature_months),
        month_note: dash(item.month_note),
        source_page: dash(item.source_page)
      };
    }

    function buildCards(rows) {
      const groups = new Map();
      rows.map(normalizeRecord).forEach(row => {
        if (!groups.has(row.fruit)) groups.set(row.fruit, []);
        groups.get(row.fruit).push(row);
      });

      return [...groups.entries()].map(([fruit, details]) => {
        const sorted = [...details].sort((a, b) => parseCount(b.count) - parseCount(a.count) || a.store.localeCompare(b.store, "zh-CN"));
        const months = [...new Set(details.map(item => item.mature_months).filter(Boolean))].join("、");
        const platforms = [...new Set(details.map(item => normalizePlatform(item.platform)))].sort((a, b) => a.localeCompare(b, "zh-CN"));
        return { fruit, details: sorted, months, platforms };
      }).sort((a, b) => a.fruit.localeCompare(b.fruit, "zh-CN"));
    }

    function representative(card, details) {
      const source = details.length ? details : card.details;
      return [...source].sort((a, b) => parseCount(b.count) - parseCount(a.count) || a.store.localeCompare(b.store, "zh-CN"))[0];
    }

    function setupFilters() {
      const categories = [...new Set(fruitCards.map(card => categoryFor(card.fruit)))].sort((a, b) => a.localeCompare(b, "zh-CN"));
      fruitFilter.innerHTML = "";
      const all = document.createElement("option");
      all.value = "全部";
      all.textContent = "全部水果";
      fruitFilter.appendChild(all);
      [
        ["水果", categories.filter(name => !vegetableNames.has(name))],
        ["薯芋 / 蔬菜", categories.filter(name => vegetableNames.has(name))]
      ].forEach(([label, names]) => {
        if (!names.length) return;
        const group = document.createElement("optgroup");
        group.label = label;
        names.forEach(name => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          group.appendChild(option);
        });
        fruitFilter.appendChild(group);
      });
      if (!categories.includes(state.fruit)) state.fruit = "全部";
      fruitFilter.value = state.fruit;
      state.minCount = fillSelect(countFilter, ["全部", "1", "2", "3", "5", "10"], countLabel, state.minCount);
      renderMonthRail();
      renderPlatformRail();
    }

    function fillSelect(select, values, labeler, currentValue = "全部") {
      select.innerHTML = "";
      values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = labeler(value);
        select.appendChild(option);
      });
      select.value = values.includes(currentValue) ? currentValue : "全部";
      return select.value;
    }

    function renderMonthRail() {
      monthRail.innerHTML = "";
      monthOptions.forEach(value => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "chip";
        button.dataset.month = value;
        button.textContent = value === "全部" ? "全部" : monthLabel(value);
        button.addEventListener("click", () => {
          state.month = value;
          render();
        });
        monthRail.appendChild(button);
      });
    }

    function renderPlatformRail() {
      const platforms = ["全部", ...new Set(sourceRows.map(item => normalizePlatform(item.platform)))].sort((a, b) => a === "全部" ? -1 : b === "全部" ? 1 : a.localeCompare(b, "zh-CN"));
      if (!platforms.includes(state.platform)) state.platform = "全部";
      platformRail.innerHTML = "";
      platforms.forEach(value => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "chip";
        button.dataset.platform = value;
        button.textContent = value === "全部" ? "全部平台" : value;
        button.addEventListener("click", () => {
          state.platform = value;
          render();
        });
        platformRail.appendChild(button);
      });
    }

    function detailMatchesSearch(detail, query) {
      if (!query) return true;
      return [
        detail.fruit,
        categoryFor(detail.fruit),
        detail.variety,
        detail.store,
        detail.price,
        detail.count,
        detail.mature_months,
        detail.platform
      ].join(" ").toLowerCase().includes(query);
    }

    function filteredCards() {
      const query = state.query.trim().toLowerCase();
      return fruitCards.map(card => {
        if (state.fruit !== "全部" && categoryFor(card.fruit) !== state.fruit) return null;
        if (!card.details.some(detail => itemInMonth(detail, state.month))) return null;

        const matchingDetails = card.details.filter(detail => {
          if (state.platform !== "全部" && normalizePlatform(detail.platform) !== state.platform) return false;
          if (!itemInMonth(detail, state.month)) return false;
          if (state.minCount !== "全部" && parseCount(detail.count) < Number(state.minCount)) return false;
          return detailMatchesSearch(detail, query);
        });

        if (!matchingDetails.length) return null;
        return { ...card, visibleDetails: matchingDetails };
      }).filter(Boolean);
    }

    function renderStats(cards) {
      document.getElementById("totalCount").textContent = fruitCards.length;
      document.getElementById("storeCount").textContent = sourceRows.length;
      document.getElementById("visibleCount").textContent = cards.length;
      renderUsageMetrics();
      document.getElementById("resultText").textContent = `共 ${cards.length} 类`;
      document.getElementById("activeText").textContent = `${state.fruit === "全部" ? "全部水果" : state.fruit} · ${countLabel(state.minCount)} · ${monthLabel(state.month)} · ${state.platform === "全部" ? "全部平台" : state.platform}`;
      [...monthRail.children].forEach(button => button.classList.toggle("active", button.dataset.month === state.month));
      [...platformRail.children].forEach(button => button.classList.toggle("active", button.dataset.platform === state.platform));
    }

    function createCard(card) {
      const top = representative(card, card.visibleDetails);
      const button = document.createElement("button");
      button.type = "button";
      button.className = "item";
      applyFruitTheme(button, card.fruit);

      const rowTop = document.createElement("div");
      rowTop.className = "row-top";
      const name = document.createElement("div");
      const fruit = document.createElement("span");
      fruit.className = "fruit";
      fruit.textContent = `${card.fruit} · ${card.details.length}家店`;
      const title = document.createElement("h3");
      title.className = "variety";
      title.textContent = card.fruit;
      name.append(fruit, title);

      const platform = document.createElement("div");
      platform.className = "platform";
      platform.textContent = normalizePlatform(top.platform);
      rowTop.append(name, platform);

      const meta = document.createElement("div");
      meta.className = "meta";
      [
        ["购买最多店铺", dash(top.store)],
        ["价格", dash(top.price)],
        ["成熟月份", monthsText(card.months || top.mature_months)],
        ["购买次数", dash(top.count)]
      ].forEach(([label, value]) => {
        const block = document.createElement("div");
        const small = document.createElement("span");
        small.textContent = label;
        block.append(small, document.createTextNode(value));
        meta.appendChild(block);
      });

      button.append(rowTop, meta);
      button.addEventListener("click", () => openDetail(card));
      return button;
    }

    function render() {
      const cards = filteredCards();
      renderStats(cards);
      empty.style.display = cards.length ? "none" : "block";
      list.innerHTML = "";
      const fragment = document.createDocumentFragment();
      cards.forEach(card => fragment.appendChild(createCard(card)));
      list.appendChild(fragment);
      setDataStatus(sourceName, sourceName === "内置数据");
    }

    function openDetail(card) {
      applyFruitTheme(detailMask, card.fruit);
      document.getElementById("modalTitle").textContent = card.fruit;
      const details = card.visibleDetails || card.details;
      document.getElementById("modalSubtitle").textContent = `符合筛选 ${details.length} 家 / 共 ${card.details.length} 家店铺`;
      detailGrid.innerHTML = "";

      details.forEach(detail => {
        const box = document.createElement("article");
        box.className = "store-detail";
        const title = document.createElement("h3");
        title.textContent = dash(detail.store);
        const meta = document.createElement("div");
        meta.className = "detail-meta";
        [
          ["水果品种", dash(detail.variety)],
          ["店铺平台", normalizePlatform(detail.platform)],
          ["价格", dash(detail.price)],
          ["成熟月份", monthsText(detail.mature_months || card.months)],
          ["购买次数", dash(detail.count)]
        ].forEach(([label, value]) => {
          const cell = document.createElement("div");
          const small = document.createElement("span");
          small.textContent = label;
          cell.append(small, document.createTextNode(value));
          meta.appendChild(cell);
        });
        box.append(title, meta);
        detailGrid.appendChild(box);
      });
      detailMask.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeDetail() {
      detailMask.classList.remove("show");
      document.body.style.overflow = "";
    }

    function openImport() {
      importStatus.textContent = "";
      importStatus.classList.remove("error");
      passwordInput.value = "";
      excelInput.value = "";
      cloudEmailField.hidden = !cloudEnabled();
      importSubtitle.textContent = cloudEnabled()
        ? "管理员登录后同步更新所有设备"
        : "当前为本机模式：连接云端后可同步所有设备";
      importMask.classList.add("show");
      document.body.style.overflow = "hidden";
      setTimeout(() => passwordInput.focus(), 0);
    }

    function closeImport() {
      importMask.classList.remove("show");
      document.body.style.overflow = "";
    }

    function setImportStatus(text, isError = false) {
      importStatus.textContent = text;
      importStatus.classList.toggle("error", isError);
    }

    async function importExcel() {
      if (!cloudEnabled() && passwordInput.value !== importPassword) {
        setImportStatus("密码不正确", true);
        return;
      }
      const file = excelInput.files && excelInput.files[0];
      if (!file) {
          setImportStatus("请选择 Excel 或 CSV 文件", true);
        return;
      }

      try {
        setImportStatus("正在读取...");
        const rows = await parseTableFile(file);
        if (!rows.length) throw new Error("没有读取到水果数据");
        if (cloudEnabled()) {
          setImportStatus("正在安全登录并同步云端...");
          await saveCloudData(rows, file.name);
        }
        sourceRows = rows;
        sourceName = cloudEnabled() ? `云端数据 · ${file.name}` : `已导入 ${file.name}`;
        try {
          localStorage.setItem(storageKey, JSON.stringify({ name: file.name, rows }));
        } catch {}
        rebuildData();
        closeImport();
      } catch (error) {
        setImportStatus(error.message || "导入失败", true);
      }
    }

    async function clearImport() {
      try {
        if (cloudEnabled()) {
          setImportStatus("正在恢复并同步所有设备...");
          await saveCloudData(embeddedRows, "内置数据");
        } else if (passwordInput.value !== importPassword) {
          setImportStatus("密码不正确", true);
          return;
        }
        localStorage.removeItem(storageKey);
        sourceRows = embeddedRows;
        sourceName = cloudEnabled() ? "云端数据 · 内置数据" : "内置数据";
        rebuildData();
        closeImport();
      } catch (error) {
        setImportStatus(error.message || "恢复失败", true);
      }
    }

    function downloadCurrentData() {
      const cards = filteredCards();
      if (!cards.length) {
        setDownloadStatus("无可下载结果", true);
        return;
      }

      const headers = ["水果", "购买最多店铺", "店铺平台", "价格", "成熟月份", "购买次数", "店铺数量"];
      const rows = cards.map(card => {
        const top = representative(card, card.visibleDetails || card.details);
        return [
          card.fruit,
          dash(top.store),
          normalizePlatform(top.platform),
          dash(top.price),
          monthsText(card.months || top.mature_months),
          dash(top.count),
          card.details.length
        ];
      });
      const csv = "\ufeff" + [headers, ...rows].map(row => row.map(csvCell).join(",")).join("\r\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `水果推荐_${dateStamp()}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);

      usageMetrics.downloads += 1;
      saveUsageMetrics();
      renderUsageMetrics();
      setDownloadStatus(`已下载 ${formatNumber(usageMetrics.downloads)} 次`);
    }

    function csvCell(value) {
      const text = String(value ?? "").replace(/\r?\n/g, " / ");
      return `"${text.replace(/"/g, '""')}"`;
    }

    function dateStamp() {
      const now = new Date();
      const pad = value => String(value).padStart(2, "0");
      return `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
    }

    function rebuildData() {
      fruitCards = buildCards(sourceRows);
      setupFilters();
      render();
    }

    function cloudEnabled() {
      return /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(cloudConfig.url)
        && !cloudConfig.publishableKey.startsWith("SUPABASE_");
    }

    function cloudHeaders(accessToken = "") {
      return {
        apikey: cloudConfig.publishableKey,
        Authorization: `Bearer ${accessToken || cloudConfig.publishableKey}`,
        "Content-Type": "application/json"
      };
    }

    async function cloudRequest(path, options = {}) {
      const response = await fetch(`${cloudConfig.url}${path}`, options);
      if (!response.ok) {
        let detail = "";
        try { detail = (await response.json()).message || ""; } catch {}
        throw new Error(detail || `云端请求失败（${response.status}）`);
      }
      if (response.status === 204) return null;
      const text = await response.text();
      return text ? JSON.parse(text) : null;
    }

    async function loadCloudData({ quiet = false } = {}) {
      if (!cloudEnabled()) return false;
      try {
        const datasets = await cloudRequest(`/rest/v1/fruit_dataset?id=eq.${cloudDatasetId}&select=rows,source_name,updated_at`, {
          headers: cloudHeaders(), cache: "no-store"
        });
        const dataset = Array.isArray(datasets) ? datasets[0] : null;
        if (!dataset || !Array.isArray(dataset.rows) || !dataset.rows.length) return false;
        const changed = JSON.stringify(dataset.rows) !== JSON.stringify(sourceRows);
        sourceRows = dataset.rows;
        sourceName = `云端数据 · ${dataset.source_name || "水果清单"}`;
        try { localStorage.setItem(storageKey, JSON.stringify({ name: dataset.source_name, rows: dataset.rows })); } catch {}
        if (changed || !quiet) rebuildData();
        return true;
      } catch (error) {
        if (!quiet) setDataStatus(`云端暂时不可用，正在显示本机缓存：${error.message}`, true);
        return false;
      }
    }

    async function signInCloudAdmin() {
      const email = emailInput.value.trim();
      if (!email) throw new Error("请输入管理员邮箱");
      const result = await cloudRequest("/auth/v1/token?grant_type=password", {
        method: "POST",

    async function saveCloudData(rows, name) {
      const accessToken = await signInCloudAdmin();
      await cloudRequest("/rest/v1/fruit_dataset?on_conflict=id", {
        method: "POST",
        headers: { ...cloudHeaders(accessToken), Prefer: "resolution=merge-duplicates,return=minimal" },

          id: cloudDatasetId,
          rows,
          source_name: name,
          updated_at: new Date().toISOString()
        })

    async function parseTableFile(file) {
      const name = String(file.name || "").toLowerCase();
      if (name.endsWith(".csv")) return parseCsvFile(file);
      if (name.endsWith(".xlsx")) return parseXlsxFile(file);
      throw new Error("仅支持 .xlsx 或 .csv 文件");
    }

    async function parseCsvFile(file) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      let text = new TextDecoder("utf-8").decode(bytes);
      if (text.includes("\ufffd")) {
        try { text = new TextDecoder("gb18030").decode(bytes); } catch {}
      }
      const rows = parseCsvRows(text.replace(/^\ufeff/, ""));
      return rowsFromSheet(rows);
    }

    function parseCsvRows(text) {
      const firstLine = String(text).split(/\r?\n/, 1)[0] || "";
      const candidates = [",", "\t", ";"];
      const delimiter = candidates.sort((a, b) => firstLine.split(b).length - firstLine.split(a).length)[0];
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (quoted) {
          if (char === '"' && text[i + 1] === '"') {
            cell += '"';
            i += 1;
          } else if (char === '"') {
            quoted = false;
          } else {
            cell += char;
          }
        } else if (char === '"' && !cell) {
          quoted = true;
        } else if (char === delimiter) {
          row.push(cell);
          cell = "";
        } else if (char === "\n" || char === "\r") {
          if (char === "\r" && text[i + 1] === "\n") i += 1;
          row.push(cell);
          if (row.some(value => String(value).trim())) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }
      row.push(cell);
      if (row.some(value => String(value).trim())) rows.push(row);
      if (quoted) throw new Error("CSV 中存在未闭合的引号");
      return rows;
    }

    async function parseXlsxFile(file) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const zip = await readZip(bytes);
      const xml = path => {
        const bytes = zip[path];
        if (!bytes) throw new Error(`Excel缺少 ${path}`);
        return new DOMParser().parseFromString(new TextDecoder("utf-8").decode(bytes), "application/xml");
      };

      const sharedStrings = parseSharedStrings(zip["xl/sharedStrings.xml"]);
      const workbook = xml("xl/workbook.xml");
      const rels = xml("xl/_rels/workbook.xml.rels");
      const sheetPath = findSheetPath(workbook, rels, "水果推荐清单");
      const sheet = xml(sheetPath);
      const rawRows = parseSheetRows(sheet, sharedStrings);
      return rowsFromSheet(rawRows);
    }

    async function readZip(bytes) {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      let eocd = -1;
      for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 66000); i--) {
        if (view.getUint32(i, true) === 0x06054b50) {
          eocd = i;
          break;
        }
      }
      if (eocd < 0) throw new Error("不是有效的xlsx文件");

      const count = view.getUint16(eocd + 10, true);
      const centralOffset = view.getUint32(eocd + 16, true);
      const entries = {};
      let offset = centralOffset;

      for (let i = 0; i < count; i++) {
        if (view.getUint32(offset, true) !== 0x02014b50) throw new Error("xlsx目录损坏");
        const method = view.getUint16(offset + 10, true);
        const compressedSize = view.getUint32(offset + 20, true);
        const nameLength = view.getUint16(offset + 28, true);
        const extraLength = view.getUint16(offset + 30, true);
        const commentLength = view.getUint16(offset + 32, true);
        const localOffset = view.getUint32(offset + 42, true);
        const name = new TextDecoder("utf-8").decode(bytes.slice(offset + 46, offset + 46 + nameLength));

        const localNameLength = view.getUint16(localOffset + 26, true);
        const localExtraLength = view.getUint16(localOffset + 28, true);
        const dataStart = localOffset + 30 + localNameLength + localExtraLength;
        const compressed = bytes.slice(dataStart, dataStart + compressedSize);

        if (method === 0) {
          entries[name] = compressed;
        } else if (method === 8) {
          entries[name] = await inflateRaw(compressed);
        }
        offset += 46 + nameLength + extraLength + commentLength;
      }
      return entries;
    }

    async function inflateRaw(bytes) {
      if (!("DecompressionStream" in window)) throw new Error("当前浏览器不支持解析压缩xlsx");
      const stream = new DecompressionStream("deflate-raw");
      const output = new Response(stream.readable).arrayBuffer();
      const writer = stream.writable.getWriter();
      await writer.write(bytes);
      await writer.close();
      return new Uint8Array(await output);
    }

    function parseSharedStrings(bytes) {
      if (!bytes) return [];
      const doc = new DOMParser().parseFromString(new TextDecoder("utf-8").decode(bytes), "application/xml");
      return xmlElements(doc, "si").map(si => xmlElements(si, "t").map(t => t.textContent || "").join(""));
    }

    function xmlElements(root, localName) {
      return [...root.getElementsByTagName("*")].filter(element => element.localName === localName);
    }

    function findSheetPath(workbook, rels, desiredName) {
      const relMap = {};
      xmlElements(rels, "Relationship").forEach(rel => {
        relMap[rel.getAttribute("Id")] = rel.getAttribute("Target") || "";
      });
      const sheets = xmlElements(workbook, "sheet");
      const selected = sheets.find(sheet => sheet.getAttribute("name") === desiredName) || sheets[0];
      if (!selected) throw new Error("Excel中没有工作表");
      const relId = selected.getAttribute("r:id") || selected.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
      let target = relMap[relId];
      if (!target) throw new Error("找不到水果推荐清单");
      target = target.replace(/\\/g, "/");
      if (target.startsWith("/")) return target.slice(1);
      return target.startsWith("xl/") ? target : `xl/${target}`;
    }

    function parseSheetRows(sheet, sharedStrings) {
      return xmlElements(sheet, "row").map(row => {
        const values = {};
        let max = 0;
        xmlElements(row, "c").forEach(cell => {
          const ref = cell.getAttribute("r") || "";
          const col = columnNumber(ref);
          if (!col) return;
          values[col] = cellValue(cell, sharedStrings);
          max = Math.max(max, col);
        });
        return Array.from({ length: max }, (_, index) => values[index + 1] || "");
      });
    }

    function columnNumber(ref) {
      const match = String(ref).match(/[A-Z]+/);
      if (!match) return 0;
      return [...match[0]].reduce((sum, char) => sum * 26 + char.charCodeAt(0) - 64, 0);
    }

    function cellValue(cell, sharedStrings) {
      const type = cell.getAttribute("t");
      if (type === "inlineStr") return xmlElements(cell, "t").map(t => t.textContent || "").join("");
      const value = xmlElements(cell, "v")[0]?.textContent || "";
      if (type === "s") return sharedStrings[Number(value)] || "";
      return value.endsWith(".0") ? value.slice(0, -2) : value;
    }

    function rowsFromSheet(rows) {
      const headerIndex = rows.findIndex(row => row.some(value => String(value).trim() === "水果"));
      if (headerIndex < 0) throw new Error("表格缺少“水果”表头");
      const headers = rows[headerIndex].map(value => String(value).trim());
      const fieldIndex = {};
      const aliases = {
        fruit: ["水果"],
        variety: ["水果品种", "品种", "水果"],
        store: ["店铺名称", "购买最多店铺", "店铺"],
        platform: ["店铺平台"],
        price: ["价格/元（PDF原文）", "价格/元(PDF原文)", "价格"],
        count: ["购买次数"],
        mature_months: ["成熟月份"]
      };
      Object.entries(aliases).forEach(([field, names]) => {
        fieldIndex[field] = headers.findIndex(header => names.includes(header));
      });
      const missing = Object.entries(fieldIndex).filter(([, index]) => index < 0).map(([field]) => field);
      if (missing.length) throw new Error("表格缺少必要列：" + missing.join("、"));

      return rows.slice(headerIndex + 1).map(row => {
        const get = field => String(row[fieldIndex[field]] || "").trim();
        return {
          fruit: get("fruit"),
          variety: get("variety"),
          store: get("store"),
          platform: get("platform"),
          price: get("price"),
          count: get("count"),
          mature_months: get("mature_months")
        };
      }).filter(row => row.fruit || row.store || row.variety);
    }

    fruitFilter.addEventListener("change", event => {
      state.fruit = event.target.value;
      render();
    });
    countFilter.addEventListener("change", event => {
      state.minCount = event.target.value;
      render();
    });
    searchInput.addEventListener("input", event => {
      state.query = event.target.value;
      render();
    });
    document.getElementById("openImport").addEventListener("click", openImport);
    document.getElementById("downloadData").addEventListener("click", downloadCurrentData);
    document.getElementById("closeImport").addEventListener("click", closeImport);
    document.getElementById("importExcel").addEventListener("click", importExcel);
    document.getElementById("clearImport").addEventListener("click", clearImport);
    document.getElementById("closeDetail").addEventListener("click", closeDetail);
    detailMask.addEventListener("click", event => {
      if (event.target === detailMask) closeDetail();
    });
    importMask.addEventListener("click", event => {
      if (event.target === importMask) closeImport();
    });
    if (typeof window !== "undefined") {
      window.addEventListener("storage", event => {
        if (event.key !== storageKey) return;
        const stored = loadStoredRows();
        sourceRows = stored || embeddedRows;
        sourceName = stored ? "已从其他页面同步数据" : "内置数据";
        rebuildData();
      });
    }
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeDetail();
        closeImport();
      }
    });

    recordPageView();
    rebuildData();
    if (cloudEnabled()) {
      loadCloudData();
      setInterval(() => loadCloudData({ quiet: true }), cloudPollInterval);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") loadCloudData({ quiet: true });
      });
    }
  </script>
</body>
